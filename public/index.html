<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stack Viewer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%234f6df5'/%3E%3Cpath d='M16 6l10 5-10 5-10-5zM6 16l10 5 10-5M6 21l10 5 10-5' fill='none' stroke='white' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/" aria-label="Stack Viewer home">
    <svg width="22" height="22" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 6l10 5-10 5-10-5zM6 16l10 5 10-5M6 21l10 5 10-5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/></svg>
    Stack Viewer
  </a>
  <form id="load" class="load">
    <input id="stackInput" type="text" inputmode="url" placeholder="Paste a MAL stack link or ID — e.g. myanimelist.net/stacks/4015" autocomplete="off" aria-label="MyAnimeList stack link or ID" list="recentStacks">
    <datalist id="recentStacks"></datalist>
    <button type="submit" class="btn">Load</button>
  </form>
  <button id="themeBtn" class="icon-btn" title="Toggle theme" aria-label="Toggle theme"><svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 2.5a5.5 5.5 0 010 11z" fill="currentColor"/></svg></button>
</header>

<main id="app">
  <section class="empty" id="empty">
    <h1>See every anime in a stack at a glance</h1>
    <p>Genres, studio, episodes, runtime, status and synopsis for every entry — the info MyAnimeList makes you click into each page to find.</p>
    <p class="try">Try <a href="?stack=4015">stack 4015</a></p>
    <div class="recents" id="recents" hidden></div>
  </section>
</main>
<p class="kbd-hint">Press <kbd>?</kbd> for keyboard shortcuts</p>

<div id="modal" class="modal" hidden></div>
<script src="app.js"></script>
</body>
</html>
